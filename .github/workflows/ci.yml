name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy (default)
        run: cargo clippy --all-targets -- -D warnings
      - name: Run clippy (pprof)
        run: cargo clippy --all-targets --features pprof -- -D warnings
      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
      - name: Run tests (default)
        run: cargo test
      - name: Run tests (pprof)
        run: cargo test --features pprof
      - name: Run release tests with line-table debuginfo (pprof)
        env:
          RUSTFLAGS: -C debuginfo=1
        run: cargo test --release --features pprof

  cross-platform:
    name: Cross-platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy (pprof)
        run: cargo clippy --all-targets --features pprof -- -D warnings
      - name: Run tests (default)
        run: cargo test
      - name: Run tests (pprof)
        run: cargo test --features pprof

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - name: Run tests on MSRV (default)
        run: cargo test
      - name: Run tests on MSRV (pprof)
        run: cargo test --features pprof
